name: Update VPN Servers Automatically

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch, validate and generate servers.json
        run: |
          node <<'NODE'
          const fs = require('fs');

          function validIPv4(value) {
            const parts = String(value || '').split('.');
            return parts.length === 4 && parts.every(p => /^\d{1,3}$/.test(p) && Number(p) >= 0 && Number(p) <= 255);
          }

          function configInfo(encoded) {
            const decoded = Buffer.from(encoded, 'base64').toString('utf8');
            const remote = decoded.split(/\r?\n/).map(s => s.trim()).find(s => /^remote\s+/i.test(s));
            const protoLine = decoded.split(/\r?\n/).map(s => s.trim()).find(s => /^proto\s+/i.test(s));
            if (!remote) return null;
            const parts = remote.split(/\s+/);
            const port = Number(parts[2]);
            let proto = (parts[3] || (protoLine || '').split(/\s+/)[1] || '').toLowerCase();
            if (proto.startsWith('tcp')) proto = 'TCP';
            else if (proto.startsWith('udp')) proto = 'UDP';
            else return null;
            if (!Number.isInteger(port) || port < 1 || port > 65535) return null;
            return { port, proto };
          }

          async function run() {
            const response = await fetch('http://www.vpngate.net/api/iphone/', {
              headers: { 'User-Agent': 'VPN-Gate-Smart-Connect/1.0' },
              signal: AbortSignal.timeout(30000)
            });
            if (!response.ok) throw new Error('VPN Gate HTTP status: ' + response.status);
            const body = await response.text();
            if (!body.includes('HostName') || !body.includes('OpenVPN_ConfigData_Base64')) {
              throw new Error('VPN Gate response did not contain expected CSV headers');
            }

            const lines = body.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            let headers = [];
            const servers = [];
            for (const line of lines) {
              if (line.startsWith('*') && line.includes('HostName')) {
                headers = line.replace(/^\*+/, '').split(',').map(s => s.trim());
                continue;
              }
              if (!headers.length || line.startsWith('*') || !line.includes(',')) continue;
              const cols = line.split(',');
              if (cols.length < headers.length) continue;
              const row = {};
              headers.forEach((h, i) => row[h] = (cols[i] || '').trim());

              const ip = row.IP;
              const config_b64 = row.OpenVPN_ConfigData_Base64 || '';
              if (!validIPv4(ip) || !config_b64) continue;
              let config;
              try { config = configInfo(config_b64); } catch { continue; }
              if (!config) continue;

              const hostname = row.HostName || ip;
              const clean_domain = hostname.includes('.') ? hostname : ip;
              servers.push({
                id: ip + '_' + config.port + '_' + config.proto.toLowerCase(),
                hostname,
                clean_domain,
                ip,
                score: Number.parseInt(row.Score || '0', 10) || 0,
                ping: Number.parseInt(row.Ping || '0', 10) || 0,
                speed: Number.parseInt(row.Speed || '0', 10) || 0,
                country_long: row.CountryLong || 'Unknown',
                country_short: (row.CountryShort || 'UN').toUpperCase(),
                num_vpn_sessions: Number.parseInt(row.NumVpnSessions || '0', 10) || 0,
                uptime: Number.parseInt(row.Uptime || '0', 10) || 0,
                log_type: row.LogType || 'Unknown',
                no_log: (row.LogType || '').toLowerCase().includes('none'),
                openvpn_port: config.port,
                openvpn_protocol: config.proto,
                sstp_endpoint: '',
                config_b64
              });
            }

            if (servers.length < 10) {
              throw new Error('Only ' + servers.length + ' valid OpenVPN profiles found; refusing to replace the last good list');
            }

            fs.mkdirSync('public', { recursive: true });
            const output = { timestamp: Date.now(), source: 'vpngate-api-via-github-actions', count: servers.length, servers };
            fs.writeFileSync('public/servers.json', JSON.stringify(output, null, 2) + '\n');
            console.log('Generated ' + servers.length + ' validated OpenVPN servers.');
          }

          run().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit and push if servers.json changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add public/servers.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update validated VPN servers [skip ci]"
          git push
